# Safari Strives dev database
#
# Host port 5433 maps to Postgres 5432 inside the container so we do not clash
# with a system Postgres already listening on 5432.
#
# Connection string (must match backend/.env):
#   postgresql+psycopg2://postgres:postgres@localhost:5433/safari_strives
#
# Start:  docker compose up -d db
# Stop:   docker compose down
# Reset:  docker compose down -v   (deletes all data)

services:
  db:
    image: postgres:16-alpine
    container_name: safari-strives-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safari_strives
    ports:
      - "5433:5432"
    volumes:
      - safari_strives_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safari_strives"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  safari_strives_pgdata:
